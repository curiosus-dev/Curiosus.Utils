AppName: RabbitMQ Producer Sample App

# Configures logging
Log:
  # Path to NLog.config file
  LogConfigurationPath: NLog.config
  # Path to logs out directory
  LogOutputDirectory: logs

QueueName: test

# Connection to RabbitMQ (rabbitmq-docker-compose.yml)
RabbitMQ:
  ConnectionUri: amqp://test:test@localhost:5674/
  ClientName: sample_producer
